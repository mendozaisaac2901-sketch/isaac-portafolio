[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Contenido/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/Marcas cliente/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/Logo Herramienta/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/Fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/Colaboraciones de Agencias/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
